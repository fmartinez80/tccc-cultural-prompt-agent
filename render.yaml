# Render Blueprint for Scene Composer. Render reads this from the repo root.
# Secrets are marked sync: false, so Render asks for them once and keeps them
# in its own secret store; they never live in the repo.
services:
  - type: web
    name: scene-composer
    runtime: docker
    rootDir: app
    dockerfilePath: ./Dockerfile
    plan: starter
    # Jobs in progress are held in memory, so run exactly one instance.
    numInstances: 1
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: APP_URL
        sync: false
